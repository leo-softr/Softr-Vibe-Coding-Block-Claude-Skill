name: Publish to npm

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Check whether version changed
        id: check
        run: |
          PUBLISHED=$(npm view softr-vibe-coding version 2>/dev/null || echo "0.0.0")
          CURRENT=$(node -p "require('./package.json').version")
          echo "Published version: $PUBLISHED"
          echo "Current version:   $CURRENT"
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          if [ "$PUBLISHED" = "$CURRENT" ]; then
            echo "Version unchanged — skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version bumped — will publish."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Guard: npm must mirror main at all times. A push that changes any file shipped in
      # the npm package without bumping the version leaves the registry silently behind —
      # the run would otherwise go green while npm serves stale content. Fail loudly instead.
      # Manual runs (workflow_dispatch) are exempt, so you can always re-run to inspect.
      - name: Fail if published files changed without a version bump
        if: steps.check.outputs.skip == 'true' && github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          CURRENT: ${{ steps.check.outputs.current }}
        run: |
          set -euo pipefail

          # Resolve a diff base. `before` is all-zeros on a brand-new branch and can be
          # unreachable after a force-push, so fall back to the first parent before giving up.
          ZERO="0000000000000000000000000000000000000000"
          BASE=""
          if [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "$ZERO" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            BASE="$BEFORE"
          elif git rev-parse -q --verify "${AFTER}^" >/dev/null; then
            BASE="${AFTER}^"
          fi

          if [ -z "$BASE" ]; then
            echo "::warning::Cannot determine what this push changed — skipping the mirror check."
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE" "$AFTER")
          echo "Changed in this push:"
          echo "$CHANGED" | sed 's/^/  /'

          # The watched set is derived from package.json "files" (plus package.json itself)
          # rather than hardcoded here, so this guard stays correct when the shipped file
          # list changes. CHANGELOG.md is excluded: the workflow rewrites it after every
          # publish, and a hand-edit to it alone is not a reason to cut a release.
          OFFENDERS=$(CHANGED="$CHANGED" node -e '
            const pkg = require("./package.json");
            const watched = (pkg.files || [])
              .filter((f) => f !== "CHANGELOG.md")
              .concat("package.json");
            const changed = (process.env.CHANGED || "").split("\n").filter(Boolean);
            const hit = changed.filter((f) =>
              watched.some((w) => (w.endsWith("/") ? f.startsWith(w) : f === w))
            );
            process.stdout.write(hit.join("\n"));
          ')

          if [ -z "$OFFENDERS" ]; then
            echo "Nothing that ships to npm changed in this push — no release needed."
            exit 0
          fi

          echo "::error::npm is behind main — these published files changed at v${CURRENT}, which is already on the registry."
          echo "Files that ship to npm and changed without a version bump:"
          echo "$OFFENDERS" | sed 's/^/  /'
          echo ""
          echo "Cut a release so npm matches main:"
          echo "  npm version patch -m 'Release %s' && git push origin main --follow-tags"
          exit 1

      - name: Generate CHANGELOG.md entry
        if: steps.check.outputs.skip == 'false'
        env:
          PUBLISHED_VERSION: ${{ steps.check.outputs.published }}
          CURRENT_VERSION: ${{ steps.check.outputs.current }}
        run: |
          node <<'NODE_EOF'
          const fs = require('fs');
          const { execSync } = require('child_process');

          const published = process.env.PUBLISHED_VERSION;
          const current = process.env.CURRENT_VERSION;
          const today = new Date().toISOString().slice(0, 10);

          // Find the most recent commit reachable from HEAD where package.json *contained*
          // `"version": "${published}"`. We can't use `git log -S` for this — it matches both
          // additions AND removals of the string, so it would also match the bump commit
          // (which removes the published string while adding the current one), and we'd end up
          // with HEAD as the anchor and an empty range.
          let prevCommit = '';
          try {
            const commits = execSync('git rev-list HEAD -- package.json', { encoding: 'utf8' })
              .split('\n').filter(Boolean);
            for (const commit of commits) {
              const content = execSync(`git show ${commit}:package.json`, { encoding: 'utf8' });
              if (content.includes(`"version": "${published}"`)) {
                prevCommit = commit;
                break;
              }
            }
          } catch (e) {
            console.log('Anchor commit lookup failed:', e.message);
          }

          const range = prevCommit ? `${prevCommit}..HEAD` : 'HEAD';
          console.log('Commit range for new entry:', range);

          // Collect commit subjects, excluding workflow-authored CHANGELOG-only commits.
          const raw = execSync(
            `git log --pretty=%s ${range} -- . ':!CHANGELOG.md'`,
            { encoding: 'utf8' }
          );
          const subjects = raw.split('\n').filter(s => s && !s.includes('[skip ci]'));

          const entries = subjects.length
            ? subjects.map(s => `- ${s}`).join('\n')
            : '- (no notable changes)';
          const newEntry = `## [${current}] - ${today}\n${entries}\n`;

          let content = '';
          try { content = fs.readFileSync('CHANGELOG.md', 'utf8'); } catch (e) {}

          if (!content) {
            content = `# Changelog\n\n${newEntry}`;
          } else {
            const lines = content.split('\n');
            const firstH2 = lines.findIndex(l => l.startsWith('## '));
            if (firstH2 === -1) {
              content = content.replace(/\n*$/, '\n\n') + newEntry;
            } else {
              const before = lines.slice(0, firstH2).join('\n').replace(/\n*$/, '');
              const after = lines.slice(firstH2).join('\n');
              content = `${before}\n\n${newEntry}\n${after}`;
            }
          }

          fs.writeFileSync('CHANGELOG.md', content);
          console.log('--- new CHANGELOG.md head ---');
          console.log(content.split('\n').slice(0, 30).join('\n'));
          NODE_EOF

      - name: Publish to npm
        if: steps.check.outputs.skip == 'false'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit updated CHANGELOG.md
        if: steps.check.outputs.skip == 'false'
        run: |
          if git diff --quiet CHANGELOG.md; then
            echo "CHANGELOG.md unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "Update CHANGELOG.md for v${{ steps.check.outputs.current }} [skip ci]"
          git push origin HEAD:${GITHUB_REF#refs/heads/}
